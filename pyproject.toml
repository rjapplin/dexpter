[project]
name = "dexpter"
version = "1.0.1"
description = "Lightweight, flexible JSON-backed data science experiment tracker"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "R. Jacob Applin" }]
keywords = [
    "experiment-tracking",
    "mlops",
    "data-science",
    "machine-learning",
    "reproducibility",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/rjapplin/dexpter"
Repository = "https://github.com/rjapplin/dexpter"
Changelog = "https://github.com/rjapplin/dexpter/blob/main/CHANGELOG.md"
Issues = "https://github.com/rjapplin/dexpter/issues"

[project.scripts]
dexpter = "dexpter.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
